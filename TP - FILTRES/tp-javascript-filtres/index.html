<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidy</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <main class="site-container">
    <h1 class="main-title">
      <img src="images/pokeball.png" alt="">Pokédex
    </h1>
    <!-- HTML element to filter by Pokemon type -->
    <div class="filters">
      Filtrer les pokémons par type :
      <div class="select-box">
        <select name="" id="" class="js-select">
          <option value="">Tous</option>
          <option value="Acier">Acier</option>
          <option value="Combat">Combat</option>
          <option value="Dragon">Dragon</option>
          <option value="Eau">Eau</option>
          <option value="Électrik">Électrik</option>
          <option value="Fée">Fée</option>
          <option value="Feu">Feu</option>
          <option value="Glace">Glace</option>
          <option value="Insecte">Insecte</option>
          <option value="Normal">Normal</option>
          <option value="Plante">Plante</option>
          <option value="Poison">Poison</option>
          <option value="Psy">Psy</option>
          <option value="Roche">Roche</option>
          <option value="Sol">Sol</option>
          <option value="Spectre">Spectre</option>
          <option value="Ténèbres">Ténèbres</option>
          <option value="Vol">Vol</option>
        </select>
      </div>
    </div>
    <!-- HTML element containing the Pokemon cards -->
    <div class="cards js-cards">
    </div>
  </main>
  <script src="js/script.js"></script>
</body>

</html>
